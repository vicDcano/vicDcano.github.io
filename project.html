        <button id="external-anim-toggle" class="toggle-anim-nav">ANIM: ON</button>

    <script>
        document.getElementById('external-anim-toggle').addEventListener('click', function() {
            
            // NEW: Toggles the kill switch class on the entire body of the page
            document.body.classList.toggle('static-mode');

            // Visually toggle the button's colors and text instantly
            if (this.innerText === "ANIM: ON") 
            {
                this.innerText = "ANIM: OFF";
                this.style.background = "#ff007f";
                this.style.boxShadow = "0 4px 0 #800040";
            } 
            else 
            {
                this.innerText = "ANIM: ON";
                this.style.background = "#45f3ff";
                this.style.boxShadow = "0 4px 0 #0b7a84";
            }
            
            // Shout out to the browser that the toggle happened
            window.dispatchEvent(new CustomEvent('toggleArcadeAnimation'));
        });
    </script>
